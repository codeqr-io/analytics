name: CI

# This repository had no pull request CI at all. deploy-script.yml runs on push,
# release.yml runs on release, and the `protect-main` ruleset required no status
# checks -- so `main` required a pull request and then verified nothing in it.
# That is review, not verification, and the two are easy to confuse once the
# "requires a pull request" box is ticked.
#
# It matters most for dependency updates: a single grouped Dependabot PR can
# carry Next 15 -> 16, Tailwind 3 -> 4 and TypeScript 5 -> 7 across the example
# apps, and without this nothing would run to find out they stopped compiling.
#
# KNOWN GAP, so nobody reads more coverage into this than exists: the two build
# steps below build the published package and the CDN bundle. They do NOT run
# `next build` in apps/*. lint and type-check do cover the apps, so a type or
# lint error there is caught -- but a change that only breaks the bundler is
# not. tailwindcss 3 -> 4 is the worked example: it goes green here and leaves
# apps/nextjs unable to build at all.
#
# Building the apps here was tried and is not currently viable:
# `apps/nextjs-reverse-proxy` hangs on `next build`, which is its own problem
# and needs fixing before this gap can close. Until then, majors on app-only
# dependencies are held back in dependabot.yml rather than pretended to be
# verified.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Superseded pull request runs are worth cancelling; a run against main is
  # not -- that one is the record of whether that commit is green.
  #
  # The uniqueness has to live in the GROUP, not in cancel-in-progress. The
  # previous form was `cancel-in-progress: ${{ github.event_name ==
  # 'pull_request' }}`, and it cancelled main runs anyway: on 2026-07-28 four
  # merges in under a minute produced two `push` runs on main that were killed
  # the instant the next one started, before any job began. An expression there
  # reaches the runner as a string, and a non-empty "false" is truthy.
  #
  # Giving push runs a group of their own per run_id makes them incapable of
  # cancelling each other, without depending on how an expression is coerced.
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install
        uses: ./.github/composite-actions/install

      # Recursive here, unlike release.yml, which scopes lint to the published
      # package. Different questions: a release should not be blocked by an
      # example app, but a pull request that breaks one should say so.
      - name: lint
        run: pnpm -r lint

      - name: type-check
        run: pnpm -r type-check

      - name: prettier
        run: pnpm prettier -c .

      - name: build the published package
        run: pnpm --filter @codeqr/analytics build

      # The CDN bundle. Not published to npm, but it is the artifact that ends
      # up in our customers' end users' browsers, so a build failure here is the
      # most expensive one in the repo.
      - name: build the CDN bundle
        run: pnpm --filter @codeqr/analytics-script build
