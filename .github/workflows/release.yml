name: Release

# release-please and the npm publish live in one file, and the filename matters.
#
# npm's Trusted Publisher for @codeqr/analytics is registered against this
# repository AND this workflow filename. Splitting the publish into a second
# workflow would break authentication silently: the registration would stop
# matching and the publish would fail with ENEEDAUTH.
#
# That rules out the usual release-please shape, where one workflow tags the
# release and a second one runs `on: release`. It would not have worked here
# anyway -- a GitHub Release created with GITHUB_TOKEN does not start a new
# workflow run. This repo has already paid for that lesson once: a
# repository_dispatch in deploy-script.yml reported success for a year and never
# triggered playwright.yml a single time. Making the two-workflow shape work
# needs a PAT, which is exactly the long-lived static credential this workflow
# was rebuilt to get rid of.
on:
  push:
    branches: [main]

# Nothing by default. Each job asks for what it needs and no more -- in
# particular the publish job never gets `contents: write`.
permissions: {}

jobs:
  # Runs on every push to main. Most of the time it just opens or updates the
  # release pull request and stops there; `releases_created` is only true on the
  # push that merges that pull request.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # `releases_created` rather than `packages/web--release_created`: the config
  # governs exactly one package, so "any release" and "the packages/web release"
  # are the same event, and this avoids the bracket syntax a path containing `/`
  # would otherwise need.
  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install
        uses: ./.github/composite-actions/install

      # Scoped to the package that actually gets published. `pnpm -r lint` fails
      # in apps/nextjs, whose .eslintrc.json extends `next/babel` and no longer
      # resolves; those apps are examples, are private, and are not published.
      # Gating a release on them is how this step ended up commented out in the
      # first place.
      - name: lint
        run: pnpm --filter @codeqr/analytics lint

      - name: type-check
        run: pnpm -r type-check

      - name: prettier
        run: pnpm prettier -c .

      - name: build
        run: pnpm --filter @codeqr/analytics build

      # pnpm builds the tarball because it is what rewrites `workspace:` ranges
      # into real versions: packages/web devDepends on @codeqr/eslint-config at
      # `workspace:0.0.0`, which npm would otherwise publish verbatim.
      - name: pack
        working-directory: packages/web
        run: |
          tarball=$(pnpm pack | tail -1)
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      # npm does the upload, not pnpm. Provenance and Trusted Publishing are
      # implemented in the npm CLI and pnpm has neither -- `pnpm publish
      # --provenance` is accepted and silently does nothing.
      #
      # npm >= 11.5.1 is the floor for Trusted Publishing, and npm documents
      # Node 22.14+ alongside it. The tarball is already built by this point,
      # so the Node version here only affects the upload, not what ships.
      #
      # This step was added when .nvmrc pinned 18.16.1 and the composite action
      # above therefore installed a Node too old to publish. .nvmrc is 22 now,
      # so the two are the same version and this is redundant -- kept because
      # release.yml has never had a real run, and the first one should change
      # one thing at a time. Worth removing after a release proves the path.
      - name: Set up Node for publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm CLI
        run: npm install -g npm@11

      # There is no `--tag beta` step any more, and its absence is deliberate.
      #
      # The previous version had one gated on `github.event.release.prerelease`.
      # That field only exists on a `release` event, so under this trigger the
      # step could never have fired -- it would have been one more piece of CI
      # that looks like it does something and does not. release-please has no
      # prerelease path configured here; if betas are wanted later, the way in is
      # a prerelease config in release-please-config.json, not a dead `if`.
      #
      # No NODE_AUTH_TOKEN, and no fallback to one.
      #
      # Auth is OIDC: a Trusted Publisher for @codeqr/analytics is registered
      # against this repo and this workflow filename, and npm exchanges the
      # id-token granted above for a short-lived credential. This matches the
      # workflow npm documents for trusted publishing -- setup-node with a
      # registry-url, and no token env var anywhere.
      #
      # The NPM_TOKEN this job used to carry was revoked on npmjs.com. Leaving
      # the reference in would have been a fallback in name only, which is worse
      # than none: it reads like a safety net while being a dead credential.
      #
      # So if the Trusted Publisher registration is wrong, this step fails with
      # ENEEDAUTH and the release publishes nothing. That is recoverable -- fix
      # the registration and re-run this workflow run.
      - name: publish
        working-directory: packages/web
        run: npm publish "$TARBALL" --provenance --access public
