name: Deploy Analytics Script to Cloudflare Pages

# Restricted to `main` on purpose.
#
# In an `on: push` workflow GitHub runs the workflow file *from the branch that
# was pushed*. Without `branches`, that handed CLOUDFLARE_PAGES_API_KEY and
# CLOUDFLARE_ACCOUNT_ID — account-scoped credentials, not project-scoped — to
# unreviewed code on any branch. Anyone who could push a branch could edit this
# file on that branch, exfiltrate both, and then deploy to production out of
# band, with no run to show for it.
#
# What this does NOT fix, because it was never broken: pushes from other
# branches never reached cdn.codeqr.io. The Pages project is configured with
# `Production branch: main`, so the v0.2.0 tag and the
# feat/sdk-conversion-robustness branch both landed as Preview deployments on
# *.codeqr-cdn.pages.dev instead.
on:
  push:
    branches: [main]
    paths:
      - 'packages/script/**'

# The deploy job holds production CDN credentials; give it nothing else.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Install Dependencies and Build
        run: pnpm --filter @codeqr/analytics-script build

      - name: Deploy to Cloudflare Pages
        id: cloudflare-deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_KEY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The absence of `--branch` is deliberate; do not add it.
          #
          # Cloudflare decides Production vs Preview by comparing the branch
          # wrangler detects against the project's `Production branch` setting,
          # which is `main`. That inference is a second line of defence: if the
          # trigger above is ever widened, deploys from other branches still land
          # in Preview instead of on cdn.codeqr.io. Hardcoding `--branch=main`
          # would remove exactly that, and interpolating ${{ github.ref_name }}
          # would put an attacker-influenced ref name into a string this action
          # runs through a shell.
          command: pages deploy dist --project-name=codeqr-analytics --commit-dirty=true
          workingDirectory: packages/script
          packageManager: pnpm

      # Dispatch a deployment event so playwright.yml can test the bundle that
      # was just uploaded.
      #
      # This has never worked. peter-evans/repository-dispatch falls back to
      # GITHUB_TOKEN, and events created with GITHUB_TOKEN do not start new
      # workflow runs — playwright.yml has had zero runs since it was added in
      # May 2025, including after the two dispatches that reported success on
      # 2026-06-19. Since `permissions: contents: read` above, the POST itself is
      # unauthorized too. Reviving this needs a PAT; the alternative is deleting
      # this step along with playwright.yml. Until one of the two happens, the
      # Playwright suite is not part of this pipeline, whatever the step name
      # suggests.
      #
      # continue-on-error stays either way: the Cloudflare deploy above is the
      # deliverable, and this step must not be able to fail the run.
      - name: Dispatch deployment event
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: analytics-script-deployed
          client-payload: '{"deployment_url": "${{ steps.cloudflare-deploy.outputs.deployment-url }}"}'
