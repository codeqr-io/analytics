name: Deploy Analytics Script to Cloudflare Pages

# `branches` is not optional here. Without it, a push to ANY branch touching
# packages/script/** ships straight to the production Cloudflare Pages project,
# which serves cdn.codeqr.io/analytics/script*.js — code that runs in our
# customers' end users' browsers, on pages with forms. It already happened: the
# v0.2.0 ref deployed successfully without going through main, and both a
# feature branch and a Dependabot branch triggered this workflow.
on:
  push:
    branches: [main]
    paths:
      - 'packages/script/**'

# The deploy job holds production CDN credentials; give it nothing else.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Install Dependencies and Build
        run: pnpm --filter @codeqr/analytics-script build

      - name: Deploy to Cloudflare Pages
        id: cloudflare-deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_KEY }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=codeqr-analytics --commit-dirty=true
          workingDirectory: packages/script
          packageManager: pnpm

      # Dispatch deployment event to trigger Playwright tests.
      # Non-fatal: the Cloudflare deploy above is the deliverable; this dispatch
      # targets an external repo and can fail on token scope without meaning the
      # deploy itself failed, so it must not mark the whole run as failed.
      - name: Dispatch deployment event
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: analytics-script-deployed
          client-payload: '{"deployment_url": "${{ steps.cloudflare-deploy.outputs.deployment-url }}"}'
