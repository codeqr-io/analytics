version: 2

# Revised after the first run, which opened nine pull requests at once -- the
# opposite of what this file is for. Two changes: real caps on every stream, and
# major action bumps kept out of the grouped PR.

updates:
  # Everything that can reach someone outside this repo: the published npm
  # package (packages/web), the CDN bundle (packages/script), and the root
  # manifest that pins the toolchain.
  #
  # Deliberately NOT grouped. An update here ships, so each one should be read
  # on its own rather than arriving in a batch nobody opens.
  - package-ecosystem: npm
    directories:
      - '/'
      - '/packages/*'
    schedule:
      interval: weekly
    # Was 10, above the default of 5. There is no reading of three open update
    # PRs against published code that is improved by having ten.
    open-pull-requests-limit: 3

  # The example apps. All three manifests are `private: true`; they are never
  # published and never deployed.
  #
  # The grouping WORKS -- confirmed on the second run, which opened a single
  # `example-apps` PR across all three directories. The first run's split into
  # separate PRs was a first-run artifact, not a syntax problem.
  #
  # `update-types` is here for the same reason it is on github-actions below.
  # Ungrouped by SemVer level, the group's first real PR batched next 15 -> 16,
  # tailwindcss 3 -> 4, typescript 5 -> 7, eslint 8 -> 10 and cookie 0.6 -> 2.0
  # into one change. Tailwind 4 alone is a config and CSS-import rewrite, so the
  # batch was unmergeable as a unit and told you nothing about which piece was
  # the problem.
  #
  # Minor and patch batch fine and keep the alert surface down. Majors on these
  # apps are a rewrite, not a bump, and should be opened deliberately.
  - package-ecosystem: npm
    directories:
      - '/apps/*'
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      example-apps:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # Workflow actions are pinned by commit SHA. A pinned SHA never picks up an
  # upstream fix on its own, so without this the pins rot.
  #
  # CONFIRMED by the first run: Dependabot rewrites the SHA and the trailing
  # `# vX.Y.Z` comment together, so the pins are maintainable. That was the open
  # question when this file was added.
  #
  # `update-types` is the fix for what that same PR got wrong. Grouping every
  # SemVer level put checkout v3 -> v7, setup-node v4 -> v7 and wrangler-action
  # v3 -> v4 into one pull request -- including the action that deploys to the
  # CDN. If that breaks CI, nothing says which of the three did it, which is the
  # exact attribution problem the SHA pinning PR avoided by not upgrading. Minor
  # and patch batch fine; majors get read one at a time.
  # `directory: '/'` covers .github/workflows only. Composite actions live
  # outside it and were invisible to Dependabot: while it was proposing
  # setup-node v4.4.0 -> v7.0.0 in release.yml, the copy inside
  # composite-actions/install sat on v3.9.1 and was never mentioned. Same for
  # actions/cache on v3.5.0. Both are reached by every workflow in the repo,
  # since every one of them calls this action.
  #
  # A composite action needs its own entry, pointing at the directory that
  # holds its action.yml.
  - package-ecosystem: github-actions
    directories:
      - '/'
      - '/.github/composite-actions/install'
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
