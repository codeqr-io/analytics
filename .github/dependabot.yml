version: 2

# Revised after the first run, which opened nine pull requests at once -- the
# opposite of what this file is for. Two changes: real caps on every stream, and
# major action bumps kept out of the grouped PR.

updates:
  # ONE npm stream, at the workspace root, and the root is not a preference.
  #
  # Dependabot's pnpm support refuses to run inside a workspace member:
  #
  #   misconfigured_tooling: pnpm
  #   "Updating workspaces from inside a workspace subdirectory is not
  #    supported. Both `pnpm-lock.yaml` and `pnpm-workspace.yaml` exist in a
  #    parent directory. Dependabot should only update from the root workspace."
  #
  # This file used to list '/packages/*' and '/apps/*' as well, and that single
  # mistake produced every symptom this config has had:
  #
  #   - the example-apps job failed on every run, because both of its
  #     directories are workspace members
  #   - PRs opened from a member directory carried a package.json change and no
  #     pnpm-lock.yaml, so CI failed at Install with ERR_PNPM_OUTDATED_LOCKFILE
  #     -- #26, #28 and #29 were all this, not stale branches
  #   - the same upgrade arrived twice, once from the root pass and once from the
  #     member pass: #20/#29, #40/#44, #41/#45. Only the root one was mergeable.
  #
  # A pass at the root already sees every workspace member and updates their
  # manifests, which is why #22 and #24 could change packages/web/package.json
  # and the lockfile together. The member entries added nothing and broke this.
  #
  # Grouping is now by SemVer level rather than by directory, because directory
  # is no longer something this stream can express. That trade is acceptable:
  # what makes an update worth reading on its own is that it is a major, not
  # which folder it landed in. Majors still arrive one at a time.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # These three cannot go green, and saying so here is the only way to stop
    # them being reopened every week.
    #
    # No published version of @vercel/style-guide supports eslint 9 -- 6.0.0,
    # the latest, still declares `eslint: ">=8.48.0 <9"`. eslint-config-next 16
    # declares `eslint: ">=9.0.0"`, and next 16 pulls it in. So eslint 9/10 and
    # next 16 are mutually exclusive with the shared config this repo lints
    # with, and no ordering of merges resolves it.
    #
    # Both were verified failing at `lint`, not at install: eslint 10 crashes
    # the eslint 8 plugin generation in packages/web, and next 16's `next lint`
    # refuses eslint 8 in the example apps.
    #
    # Getting past this means replacing @vercel/style-guide with a config that
    # supports flat config. That is a decision about how this repo lints, and it
    # deserves to be opened deliberately rather than arriving as a red pull
    # request every Monday. Delete this block when that happens.
    ignore:
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-config-next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # Workflow actions are pinned by commit SHA. A pinned SHA never picks up an
  # upstream fix on its own, so without this the pins rot.
  #
  # CONFIRMED by the first run: Dependabot rewrites the SHA and the trailing
  # `# vX.Y.Z` comment together, so the pins are maintainable. That was the open
  # question when this file was added.
  #
  # `update-types` is the fix for what that same PR got wrong. Grouping every
  # SemVer level put checkout v3 -> v7, setup-node v4 -> v7 and wrangler-action
  # v3 -> v4 into one pull request -- including the action that deploys to the
  # CDN. If that breaks CI, nothing says which of the three did it, which is the
  # exact attribution problem the SHA pinning PR avoided by not upgrading. Minor
  # and patch batch fine; majors get read one at a time.
  #
  # `directory: '/'` covers .github/workflows only. Composite actions live
  # outside it and were invisible to Dependabot: while it was proposing
  # setup-node v4.4.0 -> v7.0.0 in release.yml, the copy inside
  # composite-actions/install sat on v3.9.1 and was never mentioned. Same for
  # actions/cache on v3.5.0. Both are reached by every workflow in the repo,
  # since every one of them calls this action.
  #
  # A composite action needs its own entry, pointing at the directory that
  # holds its action.yml. Unlike npm above, this ecosystem has no workspace and
  # no lockfile, so extra directories are exactly the right tool here.
  - package-ecosystem: github-actions
    directories:
      - '/'
      - '/.github/composite-actions/install'
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
